<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Timeline Merge — a cinematic puzzle-platformer about one traveler standing between two realities." />
    <meta name="theme-color" content="#07060d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Timeline Merge" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Timeline Merge</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='16' height='32' fill='%23e9d9b0'/%3E%3Crect x='16' width='16' height='32' fill='%23171230'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23b98bff' stroke-width='3'/%3E%3Crect x='15' width='2' height='32' fill='%23f6eeff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="game"></div>
    <div id="loading" class="overlay">
      <div>
        <div class="seam"></div>
        <p>Weaving two realities…</p>
      </div>
    </div>
    <div id="rotate" class="overlay">
      <div>
        <div class="seam"></div>
        <h1>Turn your device</h1>
        <p>Timeline Merge is played in landscape.</p>
      </div>
    </div>
    <div id="fatal" class="overlay" hidden>
      <div>
        <div class="seam"></div>
        <h1>Something went wrong</h1>
        <p>The game could not start.</p>
      </div>
    </div>
    <noscript>
      <div class="overlay">
        <div>
          <h1>Timeline Merge</h1>
          <p>This game needs JavaScript enabled to run.</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
